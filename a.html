<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop Product</title>

<style>
body {
    margin: 0;
    padding: 30px;
    background:whitesmoke ;
    font-family: Arial;
    text-align: center;
}

.product {
    max-width: 500px;
    margin: auto;
    padding: 30px;
    background: white;
    border: 2px solid black;
    border-radius: 15px;
    box-shadow: 0 5px 15px lightgrey;
}

.product-image {
    width: 300px;
    height: 250px;
    margin: 20px;
}

.description {
    color: grey;
    line-height: 1.6;
}

.price {
    font-size: 28px;
    font-weight: bold;
    color: rgb(90, 34, 210);
}

.features {
    text-align: left;
    line-height: 2;
}

button {
    padding: 13px 30px;
    border: 0;
    border-radius: 7px;
    background: rgb(5, 47, 59);
    color: white;
    font-size: 17px;
}
</style>
</head>

<body>

<div class="product">
    <h1>Modern Laptop</h1>

    <img class="product-image" alt="Modern Laptop">

    <p class="description">
        A powerful and stylish laptop designed for studying,
        programming, work, and everyday entertainment.
    </p>

    <p class="price">$899.99</p>

    <ul class="features">
        <li>Fast and powerful processor</li>
        <li>High-resolution display</li>
        <li>Long-lasting battery</li>
    </ul>

    <button>Buy Now</button>
</div>

</body>
</html>

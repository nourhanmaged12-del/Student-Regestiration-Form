<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: whitesmoke;
            font-family: Arial;
        }

        .profile-card {
            width: 600px;
            padding: 35px;
            background: white;
            text-align: center;
            border: 1px solid white;
            border-radius: 25px;
            box-shadow: 0 8px 20px white;
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0 15px;
        }

        .bio {
            color: rgb(21, 16, 16);
            line-height: 1.5;
        }

        .info {
            color: grey;
            line-height: 2;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            display: inline-block;
            margin: 5px;
            padding: 10px 18px;
            background: rgb(70, 10, 182);
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img class="profile-image" alt="Profile Picture">

        <h1>John Doe</h1>

        <p class="bio">
            I am a Computer Science student interested in programming and web development.
        </p>

        <div class="info">
            <div>Email: john@example.com</div>
            <div>Phone: 01012345678</div>
            <div>City: Cairo</div>
        </div>

        <div class="social-links">
            <a href="#">Facebook</a>
            <a href="#">LinkedIn</a>
            <a href="#">GitHub</a>
        </div>

    </div>

</body>
</html>
